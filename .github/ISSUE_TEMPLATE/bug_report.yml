name: Bug report
description: Report a reproducible problem without private repository data
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include source code, credentials, private paths, or provider transcripts.
  - type: input
    id: version
    attributes:
      label: Commit or version
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider mode
      options:
        - none
        - codex
        - claude
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Use a minimal public or synthetic repository when possible.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed result
    validations:
      required: true

